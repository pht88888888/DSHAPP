# dsh-jiuling-remote-mobile —— bundle 补丁。
#
# 这个文件的作用是往 profile 的 loader 树里 insert 一行，让本插件被真正加载。
# 官方安装器只接受「bundle 型」插件（`dsh.bundle.patch` 指向本文件），
# 没有它会被判成 `not-a-bundle` 而拒绝安装。
#
# 这一行同时管两端：
# - host 半（lib/index.js）被 Loader 加载 —— 挂浏览器桥、跟随电脑事件流；
# - client 半（lib/client.js）由 `dsh.client` 声明被 client-modules 的 host 半
#   扫描进浏览器 roster —— 注册「电脑」页签那个目录对话框。
#   两者是同一个包的两面，一行就够。
#
# 只 insert 自己一行、不碰任何既有行：补丁是「整行替换 config」而不是合并，
# 所以覆盖别人的行会造成难以排查的配置丢失。

- insert:
    - id: jiuling-remote-mobile
      name: 'dsh-jiuling-remote-mobile'
