# dsh-mobile：Android 平台裁剪 overlay（针对 dsh 0.2.2-rc.1）
#
# 背景：Android 的 libc 是 bionic 而非 glibc，下列包在模块顶层 `import`
# 平台原生二进制，在 Android 上必然加载失败并导致引擎启动崩溃：
#
#   dsh-subprocess-local  → import * as nodePty from "node-pty"
#   dsh-attachment-local  → import sharp from "sharp"
#
# 二者的 prebuilds 均只有 darwin / linux / win32，没有 android 变体。
# koffi 是懒加载（仅 win32 分支才 import），Android 上不会触碰，无需禁用。

# ── 直接引入原生模块，必须禁用 ──────────────────────────────────────
- id: subprocess
  disabled: true
- id: attachment-local
  disabled: true

# ── 依赖 subprocess 的能力：手机上要么无意义，要么本就不做 ──────────
- id: shell-env
  disabled: true
- id: tool-fs-search
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: directory-picker
  disabled: true
